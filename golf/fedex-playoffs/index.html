<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FedEx Cup Playoffs Fantasy Golf</title>
    <link rel="icon" href="/favicon.ico" />

    <link rel="stylesheet" href="/css/design-tokens.css" />
    <link rel="stylesheet" href="/css/components.css" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/auth.js"></script>
</head>
<body>

    <nav class="nav">
        <a href="/index.html" class="nav-logo">Sports Portal</a>
        <div class="nav-links">
            <a href="/index.html" class="nav-link">Home</a>
            <a href="/golf/index.html" class="nav-link">Golf</a>
            <a href="/login/index.html" class="nav-link">Login</a>
            <a href="/login/index.html" class="nav-link">Signup</a>
        </div>
    </nav>

    <main class="page-wrapper page-wrapper--center">
        <h1 class="page-heading">FedEx Cup Playoffs Fantasy Golf</h1>
        <p class="page-subhead">Draft your golfers, score across all three playoff events</p>

        <div class="mb-5">
            <a href="/golf/fedex-playoffs/setup/" class="btn btn--primary">Create League</a>
        </div>

        <div class="card form-card">
            <p class="subsection-label">Have an invite link or code?</p>
            <div class="flex gap-2">
                <input type="text" id="invite-input" class="input" placeholder="Paste invite link or enter code" />
                <button class="btn btn--primary" onclick="joinLeague()">Join</button>
            </div>
            <p id="join-error" class="hint error hidden">Enter a valid invite link or code.</p>
        </div>
    </main>

    <footer class="site-footer">
        2026 The Sports Portal. All rights reserved.
    </footer>

    <script>
        function joinLeague() {
            const val = document.getElementById('invite-input').value.trim();
            const errEl = document.getElementById('join-error');
            if (!val) {
                errEl.classList.remove('hidden');
                return;
            }
            errEl.classList.add('hidden');
            const match = val.match(/fcp-([a-z0-9]+)/i);
            const code = match ? match[1].toLowerCase() : val.toLowerCase();
            window.location.href = '/join/?code=fcp-' + code;
        }

        document.getElementById('invite-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') joinLeague();
        });

        renderDashboardLink();
    </script>
</body>
</html>
