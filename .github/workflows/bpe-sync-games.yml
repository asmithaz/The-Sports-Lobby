name: CFB Bowl Season Pick 'Em — Game Sync

# No `schedule:` trigger — the recurring sync runs as a pg_cron + pg_net
# job inside Postgres itself (cfb/bowl-season-pick-em/schema.sql SECTION
# 10), moved there 2026-09-09 per the lesson learned from fcp-sync-scores'
# GitHub Actions `schedule:` going silent for 5+ hours during a live event
# on 2026-08-27 (see .github/workflows/fcp-sync-scores.yml and
# wpe-sync-games.yml, which launched on the pg_cron pattern from day one).
# workflow_dispatch is kept as a manual fallback / for local testing —
# update SEASON below each year.
on:
  workflow_dispatch: {}

env:
  SEASON: "2026"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call bpe-sync-games Edge Function
        run: |
          curl -sS -X POST "${SUPABASE_URL}/functions/v1/bpe-sync-games?season=${SEASON}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --fail-with-body
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
