name: FedEx Cup Playoffs Projected Rank Sync

# Runs every 10 minutes, but the job exits immediately unless today falls
# within the FedEx Cup Playoffs window (St. Jude Championship through the
# end of BMW). Update PLAYOFFS_START / PLAYOFFS_END each season.
#
# Unlike fcp-sync-scores.yml, this window stops BEFORE the TOUR
# Championship: pgatour.com/fedexcup/projected-standings drops its live
# "projected" data once the BMW Championship ends — confirmed 2026-08-25,
# the page now just shows the final post-BMW standings plus TC tee times,
# with no projectedPlayers data for the scraper to find. That's expected,
# not a bug — at TC the field is fixed at the top 30 and, since the 2023
# format change, it's decided by straight stroke play (no staggered
# scoring start from FedEx Cup points anymore), so a "projected FedEx
# rank" isn't a meaningful concept there. Kept as a separate
# workflow/function (rather than folded into fcp-sync-scores) so a
# pgatour.com shape change can't take down the ESPN score sync too (see
# supabase/functions/fcp-sync-projected-rank).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

env:
  PLAYOFFS_START: "2026-08-06"
  PLAYOFFS_END: "2026-08-26"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check playoff window
        id: window
        run: |
          today=$(date -u +%Y-%m-%d)
          if [[ "$today" < "$PLAYOFFS_START" || "$today" > "$PLAYOFFS_END" ]]; then
            echo "Outside FedEx Cup Playoffs window ($PLAYOFFS_START to $PLAYOFFS_END) — skipping."
            echo "in_window=false" >> "$GITHUB_OUTPUT"
          else
            echo "in_window=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Call fcp-sync-projected-rank Edge Function
        if: steps.window.outputs.in_window == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          curl -sS -X POST "${SUPABASE_URL}/functions/v1/fcp-sync-projected-rank" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --fail-with-body
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
