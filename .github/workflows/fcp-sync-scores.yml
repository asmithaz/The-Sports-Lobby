name: FedEx Cup Playoffs Score Sync

# The `schedule:` trigger was removed 2026-08-27 — GitHub documents scheduled
# workflows as best-effort with no timing SLA at any interval, and this one
# went fully silent for 5+ hours during the live TOUR Championship despite a
# nominal */10 schedule. The recurring sync now runs as a pg_cron + pg_net
# job inside Postgres itself (golf/fedex-playoffs/schema.sql SECTION 13),
# same pattern as the draft auto-start/autopick jobs in SECTION 12.
# workflow_dispatch is kept as a manual fallback / for local testing.
on:
  workflow_dispatch: {}

env:
  PLAYOFFS_START: "2026-08-06"
  PLAYOFFS_END: "2026-08-31"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check playoff window
        id: window
        run: |
          today=$(date -u +%Y-%m-%d)
          if [[ "$today" < "$PLAYOFFS_START" || "$today" > "$PLAYOFFS_END" ]]; then
            echo "Outside FedEx Cup Playoffs window ($PLAYOFFS_START to $PLAYOFFS_END) — skipping."
            echo "in_window=false" >> "$GITHUB_OUTPUT"
          else
            echo "in_window=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Call fcp-sync-scores Edge Function
        if: steps.window.outputs.in_window == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          curl -sS -X POST "${SUPABASE_URL}/functions/v1/fcp-sync-scores" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --fail-with-body
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
