name: FedEx Cup Playoffs Draft Cron

# Runs every 15 minutes year-round (drafts get scheduled well before the
# playoff window itself, so this isn't gated to PLAYOFFS_START/END like
# fcp-sync-scores.yml). The function itself is a no-op read+early-return
# when no league has a pending draft, but every scheduled run still burns
# a billed GitHub Actions minute regardless — that's what forced this down
# from */5. 15 minutes still guarantees >=2 checks inside the 30-minute
# draft-reminder-email window, and autopick here is just a backup (the
# real autopick loop runs every 15s directly in Postgres via pg_cron —
# see golf/fedex-playoffs/schema.sql SECTION 12 and
# supabase/functions/fcp-draft-cron/index.ts).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call fcp-draft-cron Edge Function
        run: |
          curl -sS -X POST "${SUPABASE_URL}/functions/v1/fcp-draft-cron" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --fail-with-body
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
