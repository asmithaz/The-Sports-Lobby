<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>World Cup Bracket Challenge</title>
    <link rel="icon" href="favicon.ico" />

    <link rel="stylesheet" href="/css/design-tokens.css" />
    <link rel="stylesheet" href="/css/components.css" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/auth.js"></script>
</head>
<body>

    <nav class="nav">
        <a href="/index.html" class="nav-logo">The Sports Lobby</a>
        <div class="nav-links">
            <a href="/soccer/" class="nav-link">Soccer</a>
            <a href="/login/index.html" class="nav-link">Login</a>
            <a href="/login/index.html" class="nav-link">Signup</a>
        </div>
    </nav>

    <main class="page-wrapper page-wrapper--center">
        <h1 class="page-heading">World Cup Bracket Challenge</h1>
        <p class="page-subhead">Invite Friends to Your League</p>

        <form id="invite-form" class="stack-form">

            <!-- Invite Method -->
            <div class="form-card">
                <div class="field">
                    <label class="label">Invite Method</label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="invite-method" value="email" checked onchange="showInviteMethod('email')" />
                            <span class="radio-label">
                                <strong>Send Email Invites</strong>
                                <span>Send invitations directly to your friends' email addresses</span>
                            </span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="invite-method" value="link" onchange="showInviteMethod('link')" />
                            <span class="radio-label">
                                <strong>Generate Invite Link</strong>
                                <span>Share a link that anyone can use to join your league</span>
                            </span>
                        </label>
                    </div>
                </div>

                <!-- Email input -->
                <div class="tier-section" id="email-section">
                    <label class="subsection-label">Email Addresses</label>
                    <div class="email-tag-container" id="email-tag-container" onclick="document.getElementById('email-input').focus()">
                        <input type="text" id="email-input" placeholder="Enter email and press Enter or comma" />
                    </div>
                    <span class="hint">Press Enter or , to add each address</span>
                </div>

                <!-- Link -->
                <div class="tier-section hidden" id="link-section">
                    <label class="subsection-label">Invite Link</label>
                    <div class="link-row">
                        <input type="text" id="invite-link" class="input" readonly value="https://thesportslobby.com/join/wcbc-abc123" />
                        <button type="button" class="btn btn--ghost" onclick="copyLink()">Copy</button>
                    </div>
                </div>
            </div>

            <!-- League Password (private leagues only) -->
            <div class="form-card" id="password-card">
                <div class="field">
                    <label class="label" for="league-password">League Password <span class="optional">— optional</span></label>
                    <div class="password-wrapper">
                        <input type="password" id="league-password" name="league-password" class="input" placeholder="Set a password to restrict joining" maxlength="30" oninput="updatePasswordCounter(this)" />
                        <button type="button" class="eye-btn" onclick="togglePassword(this)" aria-label="Toggle password visibility">
                            <!-- Eye (hidden) -->
                            <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <!-- Eye-slash (visible) -->
                            <svg class="icon-eye-slash hidden" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                    <span class="char-counter" id="pass-counter">0 / 30</span>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn--primary">Create League</button>
            </div>

        </form>
    </main>

    <footer class="site-footer">
        2026 The Sports Lobby. All rights reserved.
    </footer>

    <script>
        // Invite method toggle
        function showInviteMethod(method) {
            document.getElementById('email-section').classList.toggle('hidden', method !== 'email');
            document.getElementById('link-section').classList.toggle('hidden', method !== 'link');
        }

        // Email tags
        const emailInput = document.getElementById('email-input');
        emailInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' || e.key === ',') {
                e.preventDefault();
                addEmailTag(this.value.trim().replace(/,$/, ''));
            }
        });

        function addEmailTag(email) {
            if (!email) return;
            const container = document.getElementById('email-tag-container');
            const tag = document.createElement('span');
            tag.className = 'email-tag';
            tag.innerHTML = `${email} <button type="button" onclick="this.parentElement.remove()" aria-label="Remove">&times;</button>`;
            container.insertBefore(tag, emailInput);
            emailInput.value = '';
        }

        // Copy link
        function copyLink() {
            const link = document.getElementById('invite-link');
            navigator.clipboard.writeText(link.value).then(() => {
                const btn = document.querySelector('.copy-btn, [onclick="copyLink()"]');
                btn.textContent = 'Copied!';
                setTimeout(() => btn.textContent = 'Copy', 2000);
            });
        }

        // Show password card only for private leagues
        if (sessionStorage.getItem('league_visibility') === 'public') {
            document.getElementById('password-card').classList.add('hidden');
        }

        // Password toggle
        function togglePassword(btn) {
            const input = document.getElementById('league-password');
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            btn.querySelector('.icon-eye').classList.toggle('hidden', isHidden);
            btn.querySelector('.icon-eye-slash').classList.toggle('hidden', !isHidden);
        }

        // Password counter
        function updatePasswordCounter(input) {
            document.getElementById('pass-counter').textContent = input.value.length + ' / 30';
        }

        document.getElementById('invite-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const leagueType = sessionStorage.getItem('league_type');
            if (leagueType === 'knockout-only') {
                window.location.href = '/soccer/world-cup-bracket-challenge/dashboard/';
            } else {
                window.location.href = '/soccer/world-cup-bracket-challenge/picks/';
            }
        });

    </script>
</body>
</html>
