<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>World Cup Country Draft</title>
    <link rel="icon" href="/favicon.ico" />

    <link rel="stylesheet" href="/css/design-tokens.css" />
    <link rel="stylesheet" href="/css/components.css" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/error-logging.js"></script>
    <script src="/js/feedback.js"></script>
    <script src="/js/auth.js"></script>
</head>
<body>

    <nav class="nav">
        <a href="/index.html" class="nav-logo">The Sports Lobby</a>
        <div class="nav-links">
            <a href="/soccer/" class="nav-link">Soccer</a>
            <a href="/login/index.html" class="nav-link">Login</a>
            <a href="/login/index.html" class="nav-link">Signup</a>
        </div>
    </nav>

    <main class="page-wrapper page-wrapper--center">
        <h1 class="page-heading">World Cup Country Draft</h1>
        <p class="page-subhead">Draft countries, compete all tournament long</p>

        <div class="mb-5">
            <a href="/soccer/world-cup-draft/setup/" class="btn btn--primary">Create League</a>
        </div>

        <div class="card form-card">
            <p class="subsection-label">Have an invite link or code?</p>
            <div class="flex gap-2">
                <input type="text" id="invite-input" class="input" placeholder="Paste invite link or enter code" />
                <button class="btn btn--primary" onclick="joinLeague()">Join</button>
            </div>
            <p id="join-error" class="hint error hidden">Enter a valid invite link or code.</p>
        </div>
    </main>

    <footer class="site-footer">
        <span>2026 The Sports Lobby. All rights reserved.</span>
        <span class="footer-sep">&middot;</span>
        <a href="/legal/terms.html" class="footer-link">Terms</a>
        <span class="footer-sep">&middot;</span>
        <a href="/legal/privacy.html" class="footer-link">Privacy</a>
        <span class="footer-sep">&middot;</span>
        <a href="#" class="footer-link" data-feedback-trigger>Feedback</a>
        <span class="footer-sep">&middot;</span>
        <a href="https://venmo.com/u/smithaz" class="footer-link" target="_blank" rel="noopener">💚 Support</a>
    </footer>

    <script>
        function joinLeague() {
            const val = document.getElementById('invite-input').value.trim();
            const errEl = document.getElementById('join-error');
            if (!val) {
                errEl.classList.remove('hidden');
                return;
            }
            errEl.classList.add('hidden');
            const match = val.match(/wcd-([a-z0-9]+)/i);
            const code = match ? match[1].toLowerCase() : val.toLowerCase();
            window.location.href = '/join/?code=wcd-' + code;
        }

        document.getElementById('invite-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') joinLeague();
        });

    </script>
</body>
</html>
