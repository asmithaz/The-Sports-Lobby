<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Reset your password on The Sports Lobby" />
    <title>Forgot Password — The Sports Lobby</title>

    <link rel="icon" href="/favicon.ico" />

    <link rel="stylesheet" href="/css/design-tokens.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="styles.css" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/auth.js"></script>
</head>
<body>

    <nav class="nav">
        <a href="/index.html" class="nav-logo">The Sports Lobby</a>
        <div class="nav-links">
            <a href="/login/index.html" class="nav-link">Login</a>
            <a href="/login/signup.html" class="nav-link">Signup</a>
        </div>
    </nav>

    <main class="page-wrapper login-wrapper">
        <div class="card login-card" id="request-card">
            <h2 class="page-title login-title">Forgot Password</h2>
            <p class="text-secondary text-sm mb-4">Enter your email and we'll send you a link to reset your password.</p>
            <form onsubmit="event.preventDefault(); handleReset();">
                <div class="field">
                    <label class="label" for="email">Email</label>
                    <input class="input" type="email" id="email" name="email" placeholder="Enter your email" required />
                </div>
                <p id="reset-error" class="text-danger text-xs mb-3"></p>
                <button type="submit" class="btn btn--primary login-btn-block" id="reset-btn">Send Reset Link</button>
                <div class="divider"></div>
                <a href="index.html" class="btn btn--ghost login-btn-block">Back to Log In</a>
            </form>
        </div>

        <div class="card login-card" id="sent-card" style="display:none;">
            <h2 class="page-title login-title">Check Your Email</h2>
            <p class="text-secondary text-sm mb-4">
                If an account exists for <strong id="sent-email"></strong>, we've sent a link to reset your password.
            </p>
            <a href="index.html" class="btn btn--ghost login-btn-block">Back to Log In</a>
        </div>
    </main>

    <footer class="site-footer">
        2026 The Sports Lobby. All rights reserved.
    </footer>

    <script>
        async function handleReset() {
            const email = document.getElementById('email').value.trim();
            const errorEl = document.getElementById('reset-error');
            const btn = document.getElementById('reset-btn');
            errorEl.textContent = '';

            btn.disabled = true;
            const { error } = await supabase.auth.resetPasswordForEmail(email, {
                redirectTo: window.location.origin + '/login/reset-password.html'
            });
            btn.disabled = false;

            if (error) {
                errorEl.textContent = error.message;
                return;
            }

            document.getElementById('sent-email').textContent = email;
            document.getElementById('request-card').style.display = 'none';
            document.getElementById('sent-card').style.display = 'block';
        }
    </script>
</body>
</html>
