<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Log in to The Sports Lobby" />
    <title>The Sports Lobby</title>

    <link rel="icon" href="/favicon.ico" />

    <link rel="stylesheet" href="/css/design-tokens.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="styles.css" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/error-logging.js"></script>
    <script src="/js/feedback.js"></script>
    <script src="/js/auth.js"></script>
</head>
<body>

    <nav class="nav">
        <a href="/index.html" class="nav-logo">The Sports Lobby</a>
        <div class="nav-links">
            <a href="/login/index.html" class="nav-link active">Login</a>
            <a href="/login/signup.html" class="nav-link">Signup</a>
        </div>
    </nav>

    <main class="page-wrapper login-wrapper">
        <div class="card login-card">
            <h2 class="page-title login-title">Welcome Back</h2>
            <button type="button" class="btn btn--ghost login-btn-block oauth-btn" onclick="handleGoogleLogin()">
                <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.83.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.41 5.41 0 0 1 3.68 9c0-.59.1-1.17.27-1.7V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.03l2.99-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.97l2.99 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
                Continue with Google
            </button>
            <div class="divider"></div>
            <form onsubmit="handleLogin(event)">
                <div class="field">
                    <label class="label" for="email">Email</label>
                    <input class="input" type="email" id="email" name="email" placeholder="Enter your email" />
                </div>
                <div class="field">
                    <label class="label" for="password">Password</label>
                    <div class="password-wrapper">
                        <input class="input" type="password" id="password" name="password" placeholder="Enter your password" />
                        <button type="button" class="eye-btn" onclick="togglePassword(this)" aria-label="Toggle password visibility">
                            <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="icon-eye-slash hidden" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <p id="login-error" class="text-danger text-xs mb-3"></p>
                <div class="flex gap-2 mb-4">
                    <button type="submit" class="btn btn--primary login-btn-flex">Log In</button>
                    <a href="forgot-password.html" class="btn btn--ghost login-btn-flex">Forgot Password?</a>
                </div>
                <div class="divider"></div>
                <a href="signup.html" class="btn btn--primary login-btn-block">Create New Account</a>
            </form>
        </div>
    </main>

    <footer class="site-footer">
        <span>2026 The Sports Lobby. All rights reserved.</span>
        <span class="footer-sep">&middot;</span>
        <a href="/legal/terms.html" class="footer-link">Terms</a>
        <span class="footer-sep">&middot;</span>
        <a href="/legal/privacy.html" class="footer-link">Privacy</a>
        <span class="footer-sep">&middot;</span>
        <a href="#" class="footer-link" data-feedback-trigger>Feedback</a>
        <span class="footer-sep">&middot;</span>
        <a href="https://venmo.com/u/smithaz" class="footer-link" target="_blank" rel="noopener">💚 Support</a>
    </footer>

    <script>
        function togglePassword(btn) {
            const input = document.getElementById('password');
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            btn.querySelector('.icon-eye').classList.toggle('hidden', isHidden);
            btn.querySelector('.icon-eye-slash').classList.toggle('hidden', !isHidden);
        }

        function goToPendingRedirect() {
            const redirect = localStorage.getItem('sp_redirect_after_login') || '/dashboard/';
            localStorage.removeItem('sp_redirect_after_login');
            window.location.href = redirect;
        }

        async function handleGoogleLogin() {
            const errorEl = document.getElementById('login-error');
            errorEl.textContent = '';
            const { error } = await supabase.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: window.location.origin + '/login/index.html' },
            });
            if (error) errorEl.textContent = error.message;
        }

        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('login-error');
            errorEl.textContent = '';

            const { error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                errorEl.textContent = error.message;
                return;
            }

            goToPendingRedirect();
        }

        // Covers landing here already authenticated: the signup
        // email-confirmation link (via emailRedirectTo in login/signup.html)
        // and the Google OAuth round trip both return here with a session
        // already established, with no login form submission to hang a
        // redirect off of.
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) goToPendingRedirect();
        });
    </script>
</body>
</html>
