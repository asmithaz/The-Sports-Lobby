<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Log in to Sports Portal" />
    <title>Sports Portal</title>

    <link rel="icon" href="/favicon.ico" />

    <link rel="stylesheet" href="/css/design-tokens.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="styles.css" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/auth.js"></script>
</head>
<body>

    <nav class="nav">
        <a href="/index.html" class="nav-logo">Sports Portal</a>
        <div class="nav-links">
            <a href="/index.html" class="nav-link">Home</a>
            <a href="Login.html" class="nav-link active">Login</a>
            <a href="/login/index.html" class="nav-link">Signup</a>
            <a href="about.html" class="nav-link">About</a>
        </div>
    </nav>

    <main class="page-wrapper login-wrapper">
        <div class="card login-card">
            <h2 class="page-title login-title">Welcome Back</h2>
            <form>
                <div class="field">
                    <label class="label" for="email">Email</label>
                    <input class="input" type="email" id="email" name="email" placeholder="Enter your email" />
                </div>
                <div class="field">
                    <label class="label" for="password">Password</label>
                    <input class="input" type="password" id="password" name="password" placeholder="Enter your password" />
                </div>
                <p id="login-error" class="text-danger text-xs mb-3"></p>
                <div class="flex gap-2 mb-4">
                    <button type="button" class="btn btn--primary login-btn-flex" onclick="handleLogin()">Log In</button>
                    <a href="forgot-password.html" class="btn btn--ghost login-btn-flex">Forgot Password?</a>
                </div>
                <div class="divider"></div>
                <a href="signup.html" class="btn btn--primary login-btn-block">Create New Account</a>
            </form>
        </div>
    </main>

    <footer class="site-footer">
        2026 The Sports Portal. All rights reserved.
    </footer>

    <script>
        async function handleLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('login-error');
            errorEl.textContent = '';

            const { error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                errorEl.textContent = error.message;
                return;
            }

            const redirect = sessionStorage.getItem('sp_redirect_after_login') || '/dashboard/';
            sessionStorage.removeItem('sp_redirect_after_login');
            window.location.href = redirect;
        }
    </script>
</body>
</html>
