<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Generic starter index.html for a web project" />
    <title>Sports Portal</title>

    <!-- Favicon -->
    <link rel="icon" href="favicon.ico" />

    <!-- Stylesheet (create styles.css in same folder) -->
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/auth.js"></script>
</head>
<body>

    <nav class="navbar">
        <div class="navbar-links">
            <ul>
                <li><a href="/index.html">Home</a></li>
                <li><a href="Login.html">Login</a></li>
                <li><a href="/login/index.html">Signup</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </div>
    </nav>

    <main>
        <div class="login-card">
            <h2>Welcome Back</h2>
            <form>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" />
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" />
                </div>
                <p id="login-error" class="error-msg"></p>
                <div class="btn-row">
                    <button type="button" class="btn-forgot" onclick="handleLogin()">Log In</button>
                    <a href="forgot-password.html" class="btn-forgot">Forgot Password?</a>
                </div>
                <div class="divider"></div>
                <a href="signup.html" class="btn-secondary">Create New Account</a>
            </form>
        </div>
    </main>

    <footer class="footer">
        2026 The Sports Portal. All rights reserved.
    </footer>

    <script>
        async function handleLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('login-error');
            errorEl.textContent = '';

            const { error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                errorEl.textContent = error.message;
                return;
            }

            const redirect = sessionStorage.getItem('sp_redirect_after_login') || '/index.html';
            sessionStorage.removeItem('sp_redirect_after_login');
            window.location.href = redirect;
        }
    </script>
</body>
</html>
