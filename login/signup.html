<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Create an account on The Sports Lobby" />
    <title>Sign Up — The Sports Lobby</title>

    <link rel="icon" href="/favicon.ico" />

    <link rel="stylesheet" href="/css/design-tokens.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="styles.css" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/error-logging.js"></script>
    <script src="/js/feedback.js"></script>
    <script src="/js/auth.js"></script>
</head>
<body>

    <nav class="nav">
        <a href="/index.html" class="nav-logo">The Sports Lobby</a>
        <div class="nav-links">
            <a href="index.html" class="nav-link">Login</a>
            <a href="signup.html" class="nav-link active">Signup</a>
        </div>
    </nav>

    <main class="page-wrapper login-wrapper">
        <div class="card login-card" id="signup-card">
            <h2 class="page-title login-title">Create Account</h2>
            <button type="button" class="btn btn--ghost login-btn-block oauth-btn" onclick="handleGoogleSignup()">
                <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.83.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.41 5.41 0 0 1 3.68 9c0-.59.1-1.17.27-1.7V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.03l2.99-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.97l2.99 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
                Continue with Google
            </button>
            <div class="divider"></div>
            <form onsubmit="event.preventDefault(); handleSignup();">
                <div class="field">
                    <label class="label" for="email">Email</label>
                    <input class="input" type="email" id="email" name="email" placeholder="Enter your email" required />
                </div>
                <div class="field">
                    <label class="label" for="password">Password</label>
                    <input class="input" type="password" id="password" name="password" placeholder="Create a password" required />
                </div>
                <div class="field">
                    <label class="label" for="confirm-password">Confirm Password</label>
                    <input class="input" type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" required />
                </div>
                <div class="terms-check mb-3">
                    <input type="checkbox" id="agree-terms" name="agree-terms" required />
                    <label for="agree-terms">
                        I agree to the <a href="/legal/terms.html" target="_blank">Terms of Service</a> and <a href="/legal/privacy.html" target="_blank">Privacy Policy</a>
                    </label>
                </div>
                <p id="signup-error" class="text-danger text-xs mb-3"></p>
                <button type="submit" class="btn btn--primary login-btn-block" id="signup-btn">Create Account</button>
                <div class="divider"></div>
                <a href="index.html" class="btn btn--ghost login-btn-block">Already have an account? Log In</a>
            </form>
        </div>

        <div class="card login-card" id="confirm-card" style="display:none;">
            <h2 class="page-title login-title">Check Your Email</h2>
            <p class="text-secondary text-sm mb-4">
                We sent a confirmation link to <strong id="confirm-email"></strong>. Click the link to activate your account.
            </p>
            <a href="index.html" class="btn btn--ghost login-btn-block">Back to Log In</a>
        </div>
    </main>

    <footer class="site-footer">
        <span>2026 The Sports Lobby. All rights reserved.</span>
        <span class="footer-sep">&middot;</span>
        <a href="/legal/terms.html" class="footer-link">Terms</a>
        <span class="footer-sep">&middot;</span>
        <a href="/legal/privacy.html" class="footer-link">Privacy</a>
        <span class="footer-sep">&middot;</span>
        <a href="#" class="footer-link" data-feedback-trigger>Feedback</a>
        <span class="footer-sep">&middot;</span>
        <a href="https://venmo.com/u/smithaz" class="footer-link" target="_blank" rel="noopener">💚 Support</a>
    </footer>

    <script>
        async function handleGoogleSignup() {
            const errorEl = document.getElementById('signup-error');
            errorEl.textContent = '';
            const { error } = await supabase.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: window.location.origin + '/login/index.html' },
            });
            if (error) errorEl.textContent = error.message;
        }

        async function handleSignup() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm-password').value;
            const errorEl = document.getElementById('signup-error');
            const btn = document.getElementById('signup-btn');
            errorEl.textContent = '';

            if (password !== confirm) {
                errorEl.textContent = 'Passwords do not match.';
                return;
            }

            if (password.length < 6) {
                errorEl.textContent = 'Password must be at least 6 characters.';
                return;
            }

            btn.disabled = true;
            const { error } = await supabase.auth.signUp({
                email,
                password,
                options: { emailRedirectTo: window.location.origin + '/login/index.html' },
            });
            btn.disabled = false;

            if (error) {
                errorEl.textContent = error.message;
                return;
            }

            document.getElementById('confirm-email').textContent = email;
            document.getElementById('signup-card').style.display = 'none';
            document.getElementById('confirm-card').style.display = 'block';
        }
    </script>
</body>
</html>
