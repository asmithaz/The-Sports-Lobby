<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Set a new password on The Sports Lobby" />
    <title>Reset Password — The Sports Lobby</title>

    <link rel="icon" href="/favicon.ico" />

    <link rel="stylesheet" href="/css/design-tokens.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="styles.css" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/error-logging.js"></script>
    <script src="/js/feedback.js"></script>
</head>
<body>

    <nav class="nav">
        <a href="/index.html" class="nav-logo">The Sports Lobby</a>
        <div class="nav-links"></div>
    </nav>

    <main class="page-wrapper login-wrapper">
        <div class="card login-card" id="reset-card">
            <h2 class="page-title login-title">Set New Password</h2>
            <form onsubmit="event.preventDefault(); handleUpdatePassword();">
                <div class="field">
                    <label class="label" for="password">New Password</label>
                    <input class="input" type="password" id="password" name="password" placeholder="Enter a new password" required />
                </div>
                <div class="field">
                    <label class="label" for="confirm-password">Confirm Password</label>
                    <input class="input" type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your new password" required />
                </div>
                <p id="update-error" class="text-danger text-xs mb-3"></p>
                <button type="submit" class="btn btn--primary login-btn-block" id="update-btn">Update Password</button>
            </form>
        </div>

        <div class="card login-card" id="done-card" style="display:none;">
            <h2 class="page-title login-title">Password Updated</h2>
            <p class="text-secondary text-sm mb-4">Your password has been changed.</p>
            <a href="/dashboard/" class="btn btn--primary login-btn-block">Go to Dashboard</a>
        </div>

        <div class="card login-card" id="invalid-card" style="display:none;">
            <h2 class="page-title login-title">Link Expired</h2>
            <p class="text-secondary text-sm mb-4">This password reset link is invalid or has expired.</p>
            <a href="forgot-password.html" class="btn btn--primary login-btn-block">Request a New Link</a>
        </div>
    </main>

    <footer class="site-footer">
        <span>2026 The Sports Lobby. All rights reserved.</span>
        <span class="footer-sep">&middot;</span>
        <a href="/legal/terms.html" class="footer-link">Terms</a>
        <span class="footer-sep">&middot;</span>
        <a href="/legal/privacy.html" class="footer-link">Privacy</a>
        <span class="footer-sep">&middot;</span>
        <a href="#" class="footer-link" data-feedback-trigger>Feedback</a>
        <span class="footer-sep">&middot;</span>
        <a href="https://venmo.com/u/smithaz" class="footer-link" target="_blank" rel="noopener">💚 Support</a>
    </footer>

    <script>
        let recoverySessionReady = false;

        supabase.auth.onAuthStateChange((event) => {
            if (event === 'PASSWORD_RECOVERY') recoverySessionReady = true;
        });

        async function handleUpdatePassword() {
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm-password').value;
            const errorEl = document.getElementById('update-error');
            const btn = document.getElementById('update-btn');
            errorEl.textContent = '';

            if (password !== confirm) {
                errorEl.textContent = 'Passwords do not match.';
                return;
            }
            if (password.length < 6) {
                errorEl.textContent = 'Password must be at least 6 characters.';
                return;
            }

            btn.disabled = true;
            const { error } = await supabase.auth.updateUser({ password });
            btn.disabled = false;

            if (error) {
                if (!recoverySessionReady) {
                    document.getElementById('reset-card').style.display = 'none';
                    document.getElementById('invalid-card').style.display = 'block';
                    return;
                }
                errorEl.textContent = error.message;
                return;
            }

            document.getElementById('reset-card').style.display = 'none';
            document.getElementById('done-card').style.display = 'block';
        }
    </script>
</body>
</html>
