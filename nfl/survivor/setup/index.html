<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>NFL Survivor Pool — Create League</title>
    <link rel="icon" href="/favicon.ico" />

    <link rel="stylesheet" href="/css/design-tokens.css" />
    <link rel="stylesheet" href="/css/components.css" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/error-logging.js"></script>
    <script src="/js/feedback.js"></script>
    <script src="/js/auth.js"></script>

    <style>
        .checkbox-option { display: flex; align-items: flex-start; gap: var(--space-2); cursor: pointer; }
        .checkbox-option input { accent-color: var(--c-accent); flex-shrink: 0; margin-top: 3px; }
        .checkbox-option--nested { margin-top: var(--space-3); margin-left: var(--space-5); }
    </style>
</head>
<body>

    <nav class="nav">
        <a href="/index.html" class="nav-logo">The Sports Lobby</a>
        <div class="nav-links">
            <a href="/nfl/index.html" class="nav-link">NFL</a>
            <a href="/login/index.html" class="nav-link">Login</a>
            <a href="/login/index.html" class="nav-link">Signup</a>
        </div>
    </nav>

    <main class="page-wrapper page-wrapper--center">
        <h1 class="page-heading">NFL Survivor Pool</h1>
        <p class="page-subhead">Step 1 of 2 — League Setup</p>

        <form id="league-setup-form" class="stack-form">

            <div class="form-card">
                <div class="field">
                    <label class="label" for="league-name">League Name</label>
                    <input type="text" id="league-name" name="league-name" class="input" placeholder="Enter your league name — max 30 characters" maxlength="30" required oninput="updateCounter(this)" />
                    <span class="char-counter" id="char-counter">0 / 30</span>
                </div>
            </div>

            <div class="form-card">
                <div class="field">
                    <label class="label">Picking Against</label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="pick-mode" value="straight_up" checked onchange="onPickModeChange(this.value)" />
                            <span class="radio-label">
                                <strong>Straight Up</strong>
                                <span>Your pick just needs to win the game outright</span>
                            </span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="pick-mode" value="spread" onchange="onPickModeChange(this.value)" />
                            <span class="radio-label">
                                <strong>Against the Spread</strong>
                                <span>Your pick needs to cover the spread, not just win outright</span>
                            </span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="form-card hidden" id="spread-lock-card">
                <div class="field">
                    <label class="label">Spread Lock Timing</label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="spread-lock-mode" value="week_reveal" checked />
                            <span class="radio-label">
                                <strong>Lock at Week Reveal</strong>
                                <span>The spread freezes the moment a week's games first become visible/pickable</span>
                            </span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="spread-lock-mode" value="day_before_kickoff" />
                            <span class="radio-label">
                                <strong>Lock 24 Hours Before Kickoff</strong>
                                <span>The line updates daily and locks for the whole week 24 hours before that week's first kickoff</span>
                            </span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="form-card">
                <div class="field">
                    <label class="label">Survive On</label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="result-mode" value="survive_on_win" checked />
                            <span class="radio-label">
                                <strong>Classic — Pick to Win</strong>
                                <span>Your pick needs to win (or cover, in Against the Spread mode) or you're out</span>
                            </span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="result-mode" value="survive_on_loss" />
                            <span class="radio-label">
                                <strong>Eliminator — Pick to Lose</strong>
                                <span>Your pick needs to lose (or fail to cover) or you're out</span>
                            </span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="form-card">
                <div class="field">
                    <label class="label">Lives / Mulligans</label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="lives-allowed" value="0" checked />
                            <span class="radio-label">
                                <strong>None</strong>
                                <span>One wrong pick and you're eliminated</span>
                            </span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="lives-allowed" value="1" />
                            <span class="radio-label">
                                <strong>1 Mulligan</strong>
                                <span>Your first wrong pick costs a life instead of eliminating you — the team still counts as used</span>
                            </span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="lives-allowed" value="2" />
                            <span class="radio-label">
                                <strong>2 Mulligans</strong>
                                <span>Two wrong picks before you're eliminated</span>
                            </span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="form-card">
                <div class="field">
                    <label class="label">Pick Lock Timing</label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="pick-lock-mode" value="per_game" checked />
                            <span class="radio-label">
                                <strong>5 Minutes Before Each Kickoff (default)</strong>
                                <span>Each game locks on its own — you can hold a Monday-night pick and watch Thursday and Sunday play out first, same as Yahoo/ESPN's survivor pools</span>
                            </span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="pick-lock-mode" value="sunday_kickoff" />
                            <span class="radio-label">
                                <strong>Lock Before Sunday's Games</strong>
                                <span>You can still watch Thursday night before deciding, but your pick locks in for the whole week once Sunday's slate kicks off</span>
                            </span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="pick-lock-mode" value="week_kickoff" />
                            <span class="radio-label">
                                <strong>Lock Before Thursday's Game</strong>
                                <span>Everyone commits for the whole week before the first kickoff — no information advantage from watching earlier games</span>
                            </span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="form-card">
                <label class="checkbox-option">
                    <input type="checkbox" id="continue-to-playoffs" onchange="onContinueToPlayoffsChange(this.checked)" />
                    <span>Include playoffs — the pool keeps going through the postseason instead of ending at Week 18</span>
                </label>
                <label class="checkbox-option checkbox-option--nested hidden" id="reset-teams-option">
                    <input type="checkbox" id="reset-teams-for-playoffs" />
                    <span>Reset used teams for the playoffs — by Week 19 a surviving member may have already used a team that made the playoffs, leaving them with no legal pick. Resetting gives everyone all 14 playoff teams to choose from again, separate from their regular-season picks.</span>
                </label>
            </div>

            <div class="form-card">
                <div class="field">
                    <label class="label">League Visibility</label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="visibility" value="private" checked onchange="onVisibilityChange(this.value)" />
                            <span class="radio-label">
                                <strong>Private</strong>
                                <span>Invite only — members join via link or email</span>
                            </span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="visibility" value="public" onchange="onVisibilityChange(this.value)" />
                            <span class="radio-label">
                                <strong>Public</strong>
                                <span>Anyone can find and join your league</span>
                            </span>
                        </label>
                    </div>
                </div>

                <div id="password-section" class="tier-section">
                    <label class="subsection-label" for="league-password">
                        League Password <span class="optional">— optional</span>
                    </label>
                    <div class="password-wrapper">
                        <input type="password" id="league-password" name="league-password" class="input" placeholder="Set a password to restrict joining" maxlength="30" oninput="updatePasswordCounter(this)" />
                        <button type="button" class="eye-btn" onclick="togglePassword(this)" aria-label="Toggle password visibility">
                            <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="icon-eye-slash hidden" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                    <span class="char-counter" id="pass-counter">0 / 30</span>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn--primary">Next →</button>
            </div>

        </form>
    </main>

    <footer class="site-footer">
        <span>2026 The Sports Lobby. All rights reserved.</span>
        <span class="footer-sep">&middot;</span>
        <a href="/legal/terms.html" class="footer-link">Terms</a>
        <span class="footer-sep">&middot;</span>
        <a href="/legal/privacy.html" class="footer-link">Privacy</a>
        <span class="footer-sep">&middot;</span>
        <a href="#" class="footer-link" data-feedback-trigger>Feedback</a>
        <span class="footer-sep">&middot;</span>
        <a href="https://venmo.com/u/smithaz" class="footer-link" target="_blank" rel="noopener">💚 Support</a>
    </footer>

    <script>
        function updateCounter(input) {
            document.getElementById('char-counter').textContent = input.value.length + ' / 30';
        }

        function updatePasswordCounter(input) {
            document.getElementById('pass-counter').textContent = input.value.length + ' / 30';
        }

        function onVisibilityChange(value) {
            document.getElementById('password-section').classList.toggle('hidden', value !== 'private');
        }

        function togglePassword(btn) {
            const input = document.getElementById('league-password');
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            btn.querySelector('.icon-eye').classList.toggle('hidden', isHidden);
            btn.querySelector('.icon-eye-slash').classList.toggle('hidden', !isHidden);
        }

        function onPickModeChange(value) {
            document.getElementById('spread-lock-card').classList.toggle('hidden', value !== 'spread');
        }

        function onContinueToPlayoffsChange(checked) {
            document.getElementById('reset-teams-option').classList.toggle('hidden', !checked);
            if (!checked) document.getElementById('reset-teams-for-playoffs').checked = false;
        }

        document.getElementById('league-setup-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');

            const leagueName = document.getElementById('league-name').value;
            const continueToPlayoffs = document.getElementById('continue-to-playoffs').checked;
            const resetTeamsForPlayoffs = document.getElementById('reset-teams-for-playoffs').checked;

            // Same double-submit guard as every other module's setup flow.
            if (sessionStorage.getItem('nsv_pending_league_name') === leagueName
                && sessionStorage.getItem('league_id')) {
                window.location.replace('/nfl/survivor/invite/');
                return;
            }

            btn.textContent = 'Creating…';
            btn.disabled = true;

            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = '/login/index.html';
                return;
            }

            sessionStorage.setItem('nsv_pending_league_name', leagueName);

            const visibility = document.querySelector('input[name="visibility"]:checked').value;
            const password   = document.getElementById('league-password').value.trim();
            const inviteCode = Math.random().toString(36).substring(2, 10).toUpperCase();
            const pickMode   = document.querySelector('input[name="pick-mode"]:checked').value;
            const resultMode = document.querySelector('input[name="result-mode"]:checked').value;
            const livesAllowed = document.querySelector('input[name="lives-allowed"]:checked').value;
            const pickLockMode = document.querySelector('input[name="pick-lock-mode"]:checked').value;
            const spreadLockMode = document.querySelector('input[name="spread-lock-mode"]:checked').value;

            const { data, error } = await supabase
                .from('leagues')
                .insert({
                    name: leagueName,
                    visibility: visibility,
                    commissioner_id: session.user.id,
                    invite_code: inviteCode,
                    game_type: 'nfl-survivor',
                    league_type: null,
                    league_password: password || null,
                    // Flipped to 'active' once Step 2 saves the nsv_leagues row —
                    // see invite/index.html.
                    status: 'pending'
                })
                .select()
                .single();

            if (error) {
                sessionStorage.removeItem('nsv_pending_league_name');
                btn.textContent = 'Next →';
                btn.disabled = false;
                alert('Failed to create league: ' + error.message);
                console.error(error);
                return;
            }

            sessionStorage.setItem('league_id', data.id);
            sessionStorage.setItem('league_visibility', visibility);
            sessionStorage.setItem('league_name', leagueName);
            sessionStorage.setItem('league_invite_code', inviteCode);
            sessionStorage.setItem('nsv_pick_mode', pickMode);
            sessionStorage.setItem('nsv_result_mode', resultMode);
            sessionStorage.setItem('nsv_lives_allowed', livesAllowed);
            sessionStorage.setItem('nsv_pick_lock_mode', pickLockMode);
            sessionStorage.setItem('nsv_spread_lock_mode', spreadLockMode);
            sessionStorage.setItem('nsv_continue_to_playoffs', continueToPlayoffs ? '1' : '0');
            sessionStorage.setItem('nsv_reset_teams_for_playoffs', resetTeamsForPlayoffs ? '1' : '0');
            window.location.href = '/nfl/survivor/invite/';
        });
    </script>
</body>
</html>
