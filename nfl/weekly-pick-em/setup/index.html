<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>NFL Weekly Pick 'Em — Create League</title>
    <link rel="icon" href="/favicon.ico" />

    <link rel="stylesheet" href="/css/design-tokens.css" />
    <link rel="stylesheet" href="/css/components.css" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/error-logging.js"></script>
    <script src="/js/feedback.js"></script>
    <script src="/js/auth.js"></script>

    <style>
        /* Top-align the checkbox with the first line of its (often
           multi-line) label text, instead of the browser default of
           stretching/centering it against the whole paragraph block. */
        .checkbox-option { display: flex; align-items: flex-start; gap: var(--space-2); cursor: pointer; }
        .checkbox-option input { accent-color: var(--c-accent); flex-shrink: 0; margin-top: 3px; }
    </style>
</head>
<body>

    <nav class="nav">
        <a href="/index.html" class="nav-logo">The Sports Lobby</a>
        <div class="nav-links">
            <a href="/nfl/index.html" class="nav-link">NFL</a>
            <a href="/login/index.html" class="nav-link">Login</a>
            <a href="/login/index.html" class="nav-link">Signup</a>
        </div>
    </nav>

    <main class="page-wrapper page-wrapper--center">
        <h1 class="page-heading">NFL Weekly Pick 'Em</h1>
        <p class="page-subhead">Step 1 of 2 — League Setup</p>

        <form id="league-setup-form" class="stack-form">

            <div class="form-card">
                <div class="field">
                    <label class="label" for="league-name">League Name</label>
                    <input type="text" id="league-name" name="league-name" class="input" placeholder="Enter your league name — max 30 characters" maxlength="30" required oninput="updateCounter(this)" />
                    <span class="char-counter" id="char-counter">0 / 30</span>
                </div>
            </div>

            <div class="form-card">
                <div class="field">
                    <label class="label">Picking Against</label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="pick-mode" value="straight_up" checked onchange="onPickModeChange(this.value)" />
                            <span class="radio-label">
                                <strong>Straight Up</strong>
                                <span>Pick the winner of every game</span>
                            </span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="pick-mode" value="spread" onchange="onPickModeChange(this.value)" />
                            <span class="radio-label">
                                <strong>Against the Spread</strong>
                                <span>Your pick needs to cover the spread, not just win outright</span>
                            </span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="form-card hidden" id="spread-lock-card">
                <div class="field">
                    <label class="label">Spread Lock Timing</label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="spread-lock-mode" value="week_reveal" checked />
                            <span class="radio-label">
                                <strong>Lock at Week Reveal</strong>
                                <span>The spread freezes the moment a week's games first become visible/pickable — everyone in the league picks against the exact same number all week</span>
                            </span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="spread-lock-mode" value="day_before_kickoff" />
                            <span class="radio-label">
                                <strong>Lock 24 Hours Before Kickoff</strong>
                                <span>The line updates daily and locks for the whole week 24 hours before that week's first kickoff</span>
                            </span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="form-card">
                <div class="field">
                    <label class="label">Scoring</label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="scoring-mode" value="flat" checked />
                            <span class="radio-label">
                                <strong>Flat Points</strong>
                                <span>Every correct pick is worth 1 point</span>
                            </span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="scoring-mode" value="confidence" />
                            <span class="radio-label">
                                <strong>Confidence Points</strong>
                                <span>Each week, rank your picks 1 through that week's game count — a correct pick scores its rank. Playoff weeks score with fixed points per round - 1, 2, 3, 5</span>
                            </span>
                        </label>
                    </div>
                </div>
                <label class="checkbox-option" style="margin-top:var(--space-3);">
                    <input type="checkbox" id="enable-tiebreakers" checked />
                    <span>Enable tiebreakers — two per week (total score of a random game, plus the week's last game), used only to break weekly and season-long ties</span>
                </label>
            </div>

            <div class="form-card">
                <label class="checkbox-option">
                    <input type="checkbox" id="continue-to-playoffs" />
                    <span>Include playoffs — note for Confidence leagues: playoff weeks score with fixed points per round instead - 1, 2, 3, 5</span>
                </label>
            </div>

            <div class="form-card">
                <div class="field">
                    <label class="label">League Visibility</label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="visibility" value="private" checked onchange="onVisibilityChange(this.value)" />
                            <span class="radio-label">
                                <strong>Private</strong>
                                <span>Invite only — members join via link or email</span>
                            </span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="visibility" value="public" onchange="onVisibilityChange(this.value)" />
                            <span class="radio-label">
                                <strong>Public</strong>
                                <span>Anyone can find and join your league</span>
                            </span>
                        </label>
                    </div>
                </div>

                <div id="password-section" class="tier-section">
                    <label class="subsection-label" for="league-password">
                        League Password <span class="optional">— optional</span>
                    </label>
                    <div class="password-wrapper">
                        <input type="password" id="league-password" name="league-password" class="input" placeholder="Set a password to restrict joining" maxlength="30" oninput="updatePasswordCounter(this)" />
                        <button type="button" class="eye-btn" onclick="togglePassword(this)" aria-label="Toggle password visibility">
                            <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="icon-eye-slash hidden" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                    <span class="char-counter" id="pass-counter">0 / 30</span>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn--primary">Next →</button>
            </div>

        </form>
    </main>

    <footer class="site-footer">
        <span>2026 The Sports Lobby. All rights reserved.</span>
        <span class="footer-sep">&middot;</span>
        <a href="/legal/terms.html" class="footer-link">Terms</a>
        <span class="footer-sep">&middot;</span>
        <a href="/legal/privacy.html" class="footer-link">Privacy</a>
        <span class="footer-sep">&middot;</span>
        <a href="#" class="footer-link" data-feedback-trigger>Feedback</a>
        <span class="footer-sep">&middot;</span>
        <a href="https://venmo.com/u/smithaz" class="footer-link" target="_blank" rel="noopener">💚 Support</a>
    </footer>

    <script>
        function updateCounter(input) {
            document.getElementById('char-counter').textContent = input.value.length + ' / 30';
        }

        function updatePasswordCounter(input) {
            document.getElementById('pass-counter').textContent = input.value.length + ' / 30';
        }

        function onVisibilityChange(value) {
            document.getElementById('password-section').classList.toggle('hidden', value !== 'private');
        }

        function togglePassword(btn) {
            const input = document.getElementById('league-password');
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            btn.querySelector('.icon-eye').classList.toggle('hidden', isHidden);
            btn.querySelector('.icon-eye-slash').classList.toggle('hidden', !isHidden);
        }

        // Spread lock timing only matters against the spread — hidden
        // entirely in straight-up mode.
        function onPickModeChange(value) {
            document.getElementById('spread-lock-card').classList.toggle('hidden', value !== 'spread');
        }

        document.getElementById('league-setup-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');

            const leagueName = document.getElementById('league-name').value;
            const enableTiebreakers = document.getElementById('enable-tiebreakers').checked;
            const continueToPlayoffs = document.getElementById('continue-to-playoffs').checked;

            // Same double-submit guard as CFB Weekly's setup flow — a back-button
            // resubmit after a successful create shouldn't insert a second league row.
            if (sessionStorage.getItem('nwpe_pending_league_name') === leagueName
                && sessionStorage.getItem('league_id')) {
                window.location.replace('/nfl/weekly-pick-em/invite/');
                return;
            }

            btn.textContent = 'Creating…';
            btn.disabled = true;

            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = '/login/index.html';
                return;
            }

            sessionStorage.setItem('nwpe_pending_league_name', leagueName);

            const visibility = document.querySelector('input[name="visibility"]:checked').value;
            const password   = document.getElementById('league-password').value.trim();
            const inviteCode = Math.random().toString(36).substring(2, 10).toUpperCase();
            const pickMode    = document.querySelector('input[name="pick-mode"]:checked').value;
            const scoringMode = document.querySelector('input[name="scoring-mode"]:checked').value;
            const spreadLockMode = document.querySelector('input[name="spread-lock-mode"]:checked').value;

            const { data, error } = await supabase
                .from('leagues')
                .insert({
                    name: leagueName,
                    visibility: visibility,
                    commissioner_id: session.user.id,
                    invite_code: inviteCode,
                    game_type: 'nfl-weekly-pick-em',
                    league_type: null,
                    league_password: password || null,
                    // Flipped to 'active' once Step 2 saves the nwpe_leagues row —
                    // see invite/index.html.
                    status: 'pending'
                })
                .select()
                .single();

            if (error) {
                sessionStorage.removeItem('nwpe_pending_league_name');
                btn.textContent = 'Next →';
                btn.disabled = false;
                alert('Failed to create league: ' + error.message);
                console.error(error);
                return;
            }

            sessionStorage.setItem('league_id', data.id);
            sessionStorage.setItem('league_visibility', visibility);
            sessionStorage.setItem('league_name', leagueName);
            sessionStorage.setItem('league_invite_code', inviteCode);
            sessionStorage.setItem('nwpe_pick_mode', pickMode);
            sessionStorage.setItem('nwpe_scoring_mode', scoringMode);
            sessionStorage.setItem('nwpe_spread_lock_mode', spreadLockMode);
            sessionStorage.setItem('nwpe_continue_to_playoffs', continueToPlayoffs ? '1' : '0');
            sessionStorage.setItem('nwpe_tiebreakers_enabled', enableTiebreakers ? '1' : '0');
            window.location.href = '/nfl/weekly-pick-em/invite/';
        });
    </script>
</body>
</html>
