<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>League Settings — Bowl Season Pick 'Em</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/css/design-tokens.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/error-logging.js"></script>
    <script src="/js/feedback.js"></script>
    <script src="/js/auth.js"></script>
</head>
<body>

    <nav class="nav">
        <a href="/index.html" class="nav-logo">The Sports Lobby</a>
        <div class="nav-links">
            <a href="/cfb/index.html" class="nav-link">CFB</a>
        </div>
    </nav>

    <main class="page-wrapper page-wrapper--center">
        <h2 class="page-title mb-1" id="league-name">Loading…</h2>
        <p class="page-subtitle mb-4">League Settings</p>

        <div class="card" style="width:100%; max-width:420px; margin-bottom:var(--space-4);">
            <h3 class="mb-3">Your Team Name</h3>
            <p class="field-hint mb-3">Required for this league — it's what shows in standings instead of your account name.</p>
            <form onsubmit="event.preventDefault(); saveTeamName();">
                <div class="field">
                    <label class="label" for="team-name">Team Name</label>
                    <input class="input" type="text" id="team-name" name="team-name" maxlength="30" placeholder="e.g. Sunday Scaries" required />
                </div>
                <p id="team-name-status" class="text-xs mb-3"></p>
                <button type="submit" class="btn btn--primary btn--block" id="team-name-save-btn">Save</button>
            </form>
        </div>

        <div class="card hidden" id="commissioner-card" style="width:100%; max-width:420px; margin-bottom:var(--space-4);">
            <h3 class="mb-3">League Rules</h3>
            <p class="field-hint mb-3" id="rules-lock-note"></p>
            <form onsubmit="event.preventDefault(); saveLeagueSettings();">
                <div class="field">
                    <label class="label">Picking Against</label>
                    <div class="radio-group">
                        <label class="radio-option" id="pick-mode-straight-option">
                            <input type="radio" name="pick-mode" value="straight_up" />
                            <span class="radio-label"><strong>Straight Up</strong></span>
                        </label>
                        <label class="radio-option" id="pick-mode-spread-option">
                            <input type="radio" name="pick-mode" value="spread" />
                            <span class="radio-label"><strong>Against the Spread</strong></span>
                        </label>
                    </div>
                </div>
                <div class="field">
                    <label class="label">Scoring</label>
                    <div class="radio-group">
                        <label class="radio-option" id="scoring-mode-flat-option">
                            <input type="radio" name="scoring-mode" value="flat" />
                            <span class="radio-label"><strong>Flat Points</strong></span>
                        </label>
                        <label class="radio-option" id="scoring-mode-confidence-option">
                            <input type="radio" name="scoring-mode" value="confidence" />
                            <span class="radio-label"><strong>Confidence Points</strong></span>
                        </label>
                    </div>
                </div>
                <p id="rules-status" class="text-xs mb-3"></p>
                <button type="submit" class="btn btn--primary btn--block" id="rules-save-btn">Save</button>
            </form>
        </div>

        <a href="/cfb/bowl-season-pick-em/dashboard/" class="btn btn--ghost mt-2">← Back to League Dashboard</a>
    </main>

    <footer class="site-footer">
        <span>2026 The Sports Lobby. All rights reserved.</span>
        <span class="footer-sep">&middot;</span>
        <a href="/legal/terms.html" class="footer-link">Terms</a>
        <span class="footer-sep">&middot;</span>
        <a href="/legal/privacy.html" class="footer-link">Privacy</a>
        <span class="footer-sep">&middot;</span>
        <a href="#" class="footer-link" data-feedback-trigger>Feedback</a>
        <span class="footer-sep">&middot;</span>
        <a href="https://venmo.com/u/smithaz" class="footer-link" target="_blank" rel="noopener">💚 Support</a>
    </footer>

    <script>
        let currentUserId = null;
        let leagueId = null;
        let currentSeason = null;
        let redirectAfterSave = false;

        function resolveLeagueId() {
            const fromUrl = new URLSearchParams(window.location.search).get('league_id');
            if (fromUrl) { sessionStorage.setItem('league_id', fromUrl); return fromUrl; }
            return sessionStorage.getItem('league_id');
        }

        async function init() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = '/login/index.html'; return; }
            currentUserId = session.user.id;

            leagueId = resolveLeagueId();
            if (!leagueId) { window.location.href = '/cfb/index.html'; return; }

            redirectAfterSave = new URLSearchParams(window.location.search).get('require') === 'team_name';

            const { data: leagueRow } = await supabase
                .from('leagues')
                .select('name, commissioner_id, current_season')
                .eq('id', leagueId)
                .single();

            document.getElementById('league-name').textContent = leagueRow?.name ?? 'League';
            currentSeason = leagueRow?.current_season;

            const { data: memberRow } = await supabase
                .from('league_members')
                .select('team_name')
                .eq('league_id', leagueId)
                .eq('user_id', currentUserId)
                .single();
            document.getElementById('team-name').value = memberRow?.team_name || '';

            if (leagueRow?.commissioner_id === currentUserId) {
                await initCommissionerCard();
            }
        }

        async function initCommissionerCard() {
            document.getElementById('commissioner-card').classList.remove('hidden');

            const [{ data: bpeLeague }, { count: pickCount }] = await Promise.all([
                supabase.from('bpe_leagues').select('pick_mode, scoring_mode').eq('league_id', leagueId).eq('season', currentSeason).single(),
                supabase.from('bpe_picks').select('id', { count: 'exact', head: true }).eq('league_id', leagueId).eq('season', currentSeason)
            ]);

            if (bpeLeague) {
                document.querySelector(`input[name="pick-mode"][value="${bpeLeague.pick_mode}"]`).checked = true;
                document.querySelector(`input[name="scoring-mode"][value="${bpeLeague.scoring_mode}"]`).checked = true;
            }

            const locked = (pickCount ?? 0) > 0;
            if (locked) {
                document.querySelectorAll('#commissioner-card input[type="radio"]').forEach(el => el.disabled = true);
                document.getElementById('rules-save-btn').disabled = true;
                document.getElementById('rules-lock-note').textContent =
                    'Rules are locked once anyone in the league has made a pick this season.';
            } else {
                document.getElementById('rules-lock-note').textContent =
                    'These apply league-wide and lock as soon as the first pick is made.';
            }
        }

        async function saveTeamName() {
            const input = document.getElementById('team-name');
            const statusEl = document.getElementById('team-name-status');
            const btn = document.getElementById('team-name-save-btn');
            const value = input.value.trim();

            statusEl.textContent = '';
            statusEl.className = 'text-xs mb-3';

            if (!value) {
                statusEl.textContent = 'Team name cannot be empty.';
                statusEl.classList.add('text-danger');
                return;
            }

            btn.disabled = true;
            const { error } = await supabase.rpc('set_team_name', {
                p_league_id: leagueId,
                p_team_name: value
            });
            btn.disabled = false;

            if (error) {
                statusEl.textContent = error.message;
                statusEl.classList.add('text-danger');
                return;
            }

            statusEl.textContent = redirectAfterSave ? 'Saved. Continuing…' : 'Saved.';
            statusEl.classList.add('text-accent');
            if (redirectAfterSave) {
                const dest = new URLSearchParams(window.location.search).get('next') || '/cfb/bowl-season-pick-em/dashboard/';
                setTimeout(() => { window.location.href = dest + (dest.includes('?') ? '&' : '?') + 'league_id=' + leagueId; }, 600);
            }
        }

        async function saveLeagueSettings() {
            const statusEl = document.getElementById('rules-status');
            const btn = document.getElementById('rules-save-btn');
            const pickMode = document.querySelector('input[name="pick-mode"]:checked').value;
            const scoringMode = document.querySelector('input[name="scoring-mode"]:checked').value;

            statusEl.textContent = '';
            statusEl.className = 'text-xs mb-3';
            btn.disabled = true;

            const { error } = await supabase.rpc('bpe_update_league_settings', {
                p_league_id: leagueId,
                p_pick_mode: pickMode,
                p_scoring_mode: scoringMode
            });
            btn.disabled = false;

            if (error) {
                statusEl.textContent = error.message;
                statusEl.classList.add('text-danger');
                return;
            }
            statusEl.textContent = 'Saved.';
            statusEl.classList.add('text-accent');
        }

        init();
    </script>
</body>
</html>
