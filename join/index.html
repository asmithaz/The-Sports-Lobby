<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Join League — The Sports Lobby</title>
    <link rel="icon" href="/favicon.ico" />

    <link rel="stylesheet" href="/css/design-tokens.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="styles.css" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/error-logging.js"></script>
    <script src="/js/email-templates.js"></script>
</head>
<body class="join-body">

<div class="card join-card" id="card">
    <div class="join-spinner"></div>
    <p class="text-secondary">Joining league&hellip;</p>
</div>

<script>
function escapeHtml(str) {
    const d = document.createElement('div');
    d.appendChild(document.createTextNode(str ?? ''));
    return d.innerHTML;
}

async function sendJoinConfirmation(toEmail, leagueName) {
    const subject = `You've joined ${leagueName} on The Sports Lobby`;
    const body = `<p>You're in! You've successfully joined <strong>${escapeHtml(leagueName)}</strong>.</p>`;
    const html = wrapEmail("You're in!", body);
    const { error } = await supabase.functions.invoke('send-email', {
        body: { to: toEmail, subject, html }
    });
    if (error) throw error;
}

async function joinFlow() {
    const card = document.getElementById('card');

    function show(html) { card.innerHTML = html; }

    function showError(msg) {
        show(`
            <span class="join-icon">⚠️</span>
            <h1 class="page-title join-heading">Couldn't Join</h1>
            <p class="text-secondary mb-3">${msg}</p>
            <a href="/dashboard/" class="btn btn--primary">Go to Dashboard</a>
        `);
    }

    // Parse invite code from query string: ?code=fcp-abc123 or ?code=wcd-abc123
    const params = new URLSearchParams(location.search);
    const rawCode = (params.get('code') || '').trim();

    if (!rawCode) {
        showError('No invite code found in this link. Make sure you used the full invite link shared with you.');
        return;
    }

    // Strip game prefix (fcp-, wcd-, wcbc-) — the DB stores the bare alphanumeric code
    const inviteCode = rawCode.replace(/^[a-z]+-/i, '');

    // Check auth — if not logged in, stash the full current URL and redirect to login
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
        localStorage.setItem('sp_redirect_after_login', location.href);
        window.location.href = '/login/';
        return;
    }

    show('<div class="join-spinner"></div><p class="text-secondary">Joining league&hellip;</p>');

    const { data, error } = await supabase.rpc('join_league_by_invite_code', {
        p_invite_code: inviteCode
    });

    if (error) {
        const msg = (error.message || '').includes('Invalid invite code')
            ? 'That invite code is invalid or doesn\'t exist. Double-check the link and try again.'
            : ('Error: ' + error.message);
        showError(msg);
        return;
    }

    // Store league context so the game dashboard can pick it up
    sessionStorage.setItem('league_id',          data.id);
    sessionStorage.setItem('league_name',        data.name);
    sessionStorage.setItem('league_type',        data.league_type || '');
    sessionStorage.setItem('league_invite_code', data.invite_code);
    sessionStorage.setItem('league_visibility',  data.visibility);

    // Fire-and-forget confirmation email — doesn't block the redirect below.
    sendJoinConfirmation(session.user.email, data.name).catch(err =>
        console.error('Failed to send join confirmation:', err));

    show(`
        <span class="join-icon">✅</span>
        <h1 class="page-title join-heading">You're in!</h1>
        <p class="text-secondary">Welcome to <span class="join-league-name">${data.name}</span>.<br>Taking you there now&hellip;</p>
    `);

    // Route to the correct game dashboard (mirrors dashboard/index.html enterLeague logic)
    setTimeout(() => {
        if (data.game_type === 'fedex-playoffs') {
            window.location.href = '/golf/fedex-playoffs/dashboard/';
        } else if (data.game_type === 'world-cup-draft') {
            window.location.href = '/soccer/world-cup-draft/dashboard/';
        } else if (data.game_type === 'cfb-bowl-season-pick-em') {
            window.location.href = '/cfb/bowl-season-pick-em/dashboard/';
        } else if (data.league_type === 'knockout-only') {
            window.location.href = '/soccer/world-cup-bracket-challenge/bracket/';
        } else {
            window.location.href = '/soccer/world-cup-bracket-challenge/picks/';
        }
    }, 1500);
}

joinFlow();
</script>

</body>
</html>
