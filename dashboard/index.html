<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dashboard — The Sports Lobby</title>
    <link rel="icon" href="/favicon.ico" />

    <link rel="stylesheet" href="/css/design-tokens.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="styles.css" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/auth.js"></script>
</head>
<body>

    <div class="dash-layout">

        <!-- ── Sidebar ── -->
        <aside class="dash-sidebar">
            <a href="/index.html" class="dash-logo">The Sports Lobby</a>

            <div class="dash-user">
                <div class="dash-user-avatar" id="user-avatar">?</div>
                <div class="dash-user-email" id="user-email">Loading...</div>
            </div>

            <div class="dash-section">
                <p class="dash-section-label">Your Stats</p>
                <div class="dash-stat-row">
                    <span class="dash-stat-name">Leagues Entered</span>
                    <span class="dash-stat-value" id="stat-leagues">—</span>
                </div>
                <div class="dash-stat-row">
                    <span class="dash-stat-name">🥇 1st Place</span>
                    <span class="dash-stat-value" id="stat-gold">—</span>
                </div>
                <div class="dash-stat-row">
                    <span class="dash-stat-name">🥈 2nd Place</span>
                    <span class="dash-stat-value" id="stat-silver">—</span>
                </div>
                <div class="dash-stat-row">
                    <span class="dash-stat-name">🥉 3rd Place</span>
                    <span class="dash-stat-value" id="stat-bronze">—</span>
                </div>
            </div>

            <div class="dash-section">
                <p class="dash-section-label">Browse Games</p>
                <a href="/soccer/" class="dash-link">⚽ Soccer</a>
                <a href="/nfl/" class="dash-link">🏈 Pro Football</a>
                <a href="/cbb/" class="dash-link">🏀 College Basketball</a>
                <a href="/cfb/" class="dash-link">🏟️ College Football</a>
                <a href="/golf/" class="dash-link">⛳ Golf</a>
                <a href="/olympics/" class="dash-link">🏅 Olympics</a>
            </div>

            <button class="dash-logout" onclick="logout()">Log Out</button>
        </aside>

        <!-- ── Main ── -->
        <main class="dash-main">
            <div class="dash-header">
                <h1>Your Leagues</h1>
                <a href="/soccer/world-cup-bracket-challenge/" class="btn btn--primary">+ New League</a>
            </div>

            <div class="entity-grid" id="leagues-grid">
                <p class="loading">Loading your leagues...</p>
            </div>
        </main>

    </div>

    <script>
        const GAME_LABELS = {
            'world-cup-bracket-challenge': 'World Cup Bracket Challenge',
            'world-cup-draft':             'World Cup Country Draft',
            'fedex-playoffs':              'FedEx Cup Playoffs'
        };

        const TYPE_LABELS = {
            'group-stage-only':  'Group Stage Only',
            'knockout-only':     'Knockout Only',
            'group-and-repick':  'Group + Repick'
        };

        const GAME_ICONS = {
            'world-cup-bracket-challenge': '⚽',
            'world-cup-draft':              '⚽',
            'fedex-playoffs':               '⛳'
        };

        async function init() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = '/login/index.html';
                return;
            }

            const email = session.user.email;
            document.getElementById('user-email').textContent = email;
            document.getElementById('user-avatar').textContent = email[0].toUpperCase();

            await loadLeagues(session);
        }

        async function loadLeagues(session) {
            const { data: memberships, error: mErr } = await supabase
                .from('league_members')
                .select('league_id, joined_at')
                .eq('user_id', session.user.id);

            if (mErr || !memberships || memberships.length === 0) {
                document.getElementById('stat-leagues').textContent = '0';
                document.getElementById('stat-gold').textContent = '0';
                document.getElementById('stat-silver').textContent = '0';
                document.getElementById('stat-bronze').textContent = '0';
                showEmptyState();
                return;
            }

            document.getElementById('stat-leagues').textContent = memberships.length;

            const leagueIds = memberships.map(m => m.league_id);

            const { data: leagues, error: lErr } = await supabase
                .from('leagues')
                .select('*')
                .in('id', leagueIds)
                .order('created_at', { ascending: false });

            if (lErr || !leagues || !leagues.length) {
                showEmptyState();
                return;
            }

            // Load scores to calculate trophy counts
            const { data: scores } = await supabase
                .from('wc_scores')
                .select('league_id, total_points')
                .in('league_id', leagueIds)
                .eq('user_id', session.user.id);

            // For each league with a score, check rank against all members
            // For now show 0 — will update when tournaments complete
            document.getElementById('stat-gold').textContent = '0';
            document.getElementById('stat-silver').textContent = '0';
            document.getElementById('stat-bronze').textContent = '0';

            renderLeagues(leagues, session.user.id);
        }

        function renderLeagues(leagues, userId) {
            document.getElementById('leagues-grid').innerHTML =
                leagues.map(l => leagueCard(l, userId)).join('');
        }

        function leagueCard(league, userId) {
            const isCommissioner = league.commissioner_id === userId;
            const icon  = GAME_ICONS[league.game_type]  || '🏆';
            const game  = GAME_LABELS[league.game_type]  || league.game_type;
            const type  = TYPE_LABELS[league.league_type] || league.league_type;
            const vis   = league.visibility === 'private' ? '🔒 Private' : '🌐 Public';

            return `<div class="entity-card">
                <div class="entity-card-top">
                    <span class="entity-icon">${icon}</span>
                    ${isCommissioner ? '<span class="entity-badge">Commissioner</span>' : ''}
                </div>
                <div class="entity-card-body">
                    <h2 class="entity-title">${league.name}</h2>
                    <p class="entity-subtitle">${game}</p>
                    <div class="entity-tags">
                        ${type ? `<span class="entity-tag">${type}</span>` : ''}
                        <span class="entity-tag entity-tag--muted">${vis}</span>
                    </div>
                </div>
                <div class="entity-card-footer">
                    <button class="btn btn--primary btn--block" onclick="enterLeague('${league.id}','${league.game_type}','${league.league_type}','${encodeURIComponent(league.name)}','${league.invite_code}','${league.visibility}')">
                        Enter League →
                    </button>
                </div>
            </div>`;
        }

        function enterLeague(leagueId, gameType, leagueType, leagueName, inviteCode, visibility) {
            sessionStorage.setItem('league_id',          leagueId);
            sessionStorage.setItem('league_type',        leagueType);
            sessionStorage.setItem('league_name',        decodeURIComponent(leagueName));
            sessionStorage.setItem('league_invite_code', inviteCode);
            sessionStorage.setItem('league_visibility',  visibility);

            if (gameType === 'world-cup-draft') {
                window.location.href = '/soccer/world-cup-draft/dashboard/';
            } else if (gameType === 'fedex-playoffs') {
                window.location.href = '/golf/fedex-playoffs/dashboard/';
            } else if (leagueType === 'knockout-only') {
                window.location.href = '/soccer/world-cup-bracket-challenge/bracket/';
            } else {
                window.location.href = '/soccer/world-cup-bracket-challenge/picks/';
            }
        }

        function showEmptyState() {
            document.getElementById('leagues-grid').innerHTML = `
                <div class="entity-empty">
                    <p class="entity-empty-text">You haven't joined any leagues yet.</p>
                    <a href="/soccer/world-cup-bracket-challenge/" class="btn btn--primary">Create Your First League</a>
                </div>`;
        }

        init();
    </script>

</body>
</html>
